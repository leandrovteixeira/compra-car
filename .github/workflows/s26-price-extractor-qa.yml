name: S26 Price Extraction Regression
on:
  push:
    branches: [sprint-26-agent-ux-control-center]
    paths:
      - 'packages/core/src/agents/raw-commercial-price.ts'
      - 'packages/core/src/agents/universal-price-extractor.ts'
      - 'packages/core/src/agents/raw-price-matching.ts'
      - 'packages/core/src/agents/source-first-price-reconciliation.ts'
      - 'scripts/agents/gwm-price-sources.ts'
      - 'scripts/agents/test/gwm-price-sources.test.ts'
      - 'packages/core/test/raw-commercial-price-26.test.ts'
      - 'packages/core/test/universal-price-extractor-26.test.ts'
      - 'packages/core/test/raw-price-matching-26.test.ts'
      - 'packages/core/test/source-first-price-reconciliation-26.test.ts'
      - '.github/workflows/s26-price-extractor-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extractor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.5'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Core TypeScript
        run: pnpm --filter @compra-car/core exec tsc --noEmit
      - name: Agent TypeScript
        run: pnpm --filter @compra-car/agents typecheck
      - name: GWM official product-page coverage regression
        run: pnpm --filter @compra-car/agents exec vitest run test/gwm-price-sources.test.ts
      - name: Source-first extraction and canonical-matching regressions
        run: pnpm --filter @compra-car/core exec vitest run test/raw-commercial-price-26.test.ts test/universal-price-extractor-26.test.ts test/raw-price-matching-26.test.ts test/source-first-price-reconciliation-26.test.ts
