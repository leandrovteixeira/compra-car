name: Sprint 27 Spec Agent checks
on:
  pull_request:
    paths:
      - 'packages/core/src/agents/spec-agent-*.ts'
      - 'packages/core/test/spec-agent-*.test.ts'
      - 'packages/core/test/price-agent.test.ts'
      - 'packages/core/test/price-check-classification-26.test.ts'
      - 'packages/core/src/agents/index.ts'
      - 'scripts/agents/spec-agent-*.ts'
      - '.github/workflows/spec-agent-s27.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck core
        run: pnpm --filter @compra-car/core typecheck
      - name: Spec Agent unit and regression suite
        run: pnpm --filter @compra-car/core exec vitest run test/spec-agent-reconciliation.test.ts test/spec-agent-baic-matrix.test.ts test/spec-agent-baic-import.test.ts test/spec-agent-review-projection.test.ts test/spec-agent-events.test.ts test/spec-agent-arcfox-golden.test.ts test/spec-agent-write-plan.test.ts test/spec-agent-pilot.test.ts test/spec-agent-persistence-plan.test.ts test/spec-agent-db-projection.test.ts
      - name: Typecheck agents scripts
        run: pnpm --filter @compra-car/agents typecheck
