name: Sprint 26 — Agent Contracts Validation
on:
  push:
    branches: [sprint-26-agent-ux-control-center]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ''
      SUPABASE_SERVER_KEY: ''
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Core TypeScript check
        run: pnpm --filter @compra-car/core typecheck
      - name: Contract and legacy agent-platform tests
        run: pnpm --filter @compra-car/core exec vitest run test/agent-review-contract-26.test.ts test/agent-platform.test.ts
      - name: Agent chain offline fixtures (Brand / MMV / MY / Pricing)
        run: pnpm --filter @compra-car/core exec vitest run test/brand-connector.test.ts test/current-mmv-discovery-agent.test.ts test/model-year-agent.test.ts test/price-agent.test.ts
      - name: Sidebar navigation regression
        run: pnpm --filter @compra-car/web exec vitest run src/components/admin/sidebar-navigation.test.ts
      - name: Web TypeScript check
        run: pnpm --filter @compra-car/web typecheck
      - name: Web production build (offline agent mode)
        run: pnpm --filter @compra-car/web build
      - name: Lint inbox and detail files
        run: pnpm --filter @compra-car/web exec eslint src/app/admin/agents/page.tsx src/app/admin/agents/review-detail/'[id]'/route.ts src/application/admin/agent-review-inbox.ts src/components/admin/agent-review-inbox.tsx src/app/admin/agents/flight-control/page.tsx src/components/admin/sidebar-navigation.ts src/components/admin/admin-navigation.ts src/components/admin/sidebar-navigation.test.ts
      - name: Lint contract files
        run: pnpm --filter @compra-car/core exec eslint src/agent-platform/review-contract.ts src/agent-platform/canonical-alias-contract.ts src/agent-platform/spec-create-contract.ts test/agent-review-contract-26.test.ts
