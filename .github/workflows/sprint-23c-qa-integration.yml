name: Sprint 23C QA Integration Validation
on:
  push:
    branches: [sprint-23c-qa-integration]
  pull_request:
    branches: [sprint-23-ux-react-qa]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-gate-23c:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ''
      SUPABASE_SERVER_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Sprint 23C lint
        run: pnpm --filter @compra-car/web exec eslint src/auth/entitlements-23c.ts src/auth/account-tier-server.ts src/components/account-menu-policy.ts src/app/conta src/components/user-menu.tsx src/components/admin/admin-sidebar.tsx src/components/admin/admin-navigation.ts src/components/admin/corporate-upgrade-list.tsx src/server/corporate-management.ts src/app/admin/users/page.tsx src/app/admin/users/corporate-actions.ts
      - name: Sprint 23C tests
        run: pnpm --filter @compra-car/web exec vitest run src/auth/entitlements-23c.test.ts
      - name: Build
        run: pnpm build
  legacy-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Full lint
        run: pnpm lint
      - name: Full tests
        if: always()
        run: pnpm test
