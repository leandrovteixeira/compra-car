name: Sprint 23C QA Integration Validation

on:
  push:
    branches: [sprint-23c-qa-integration]
  pull_request:
    branches: [sprint-23-ux-react-qa]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ''
      SUPABASE_SERVER_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        if: always()
        run: pnpm typecheck
      - name: Tests
        if: always()
        run: pnpm test
      - name: Sprint 23C entitlement tests
        if: always()
        run: pnpm --filter @compra-car/web exec vitest run src/auth/entitlements-23c.test.ts
      - name: Build
        if: always()
        run: pnpm build
