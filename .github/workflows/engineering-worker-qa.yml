name: QA worker learning telemetry
on:
  push:
    branches: [sprint-22-5-qa-telemetry-bridge]
  pull_request:
    branches: [sprint-21-model-year-agent]
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Agent worker typecheck
        run: pnpm --filter @compra-car/agents typecheck
      - name: Learning event tests
        run: pnpm --filter @compra-car/agents exec vitest run test/engineering-worker-telemetry.test.ts
