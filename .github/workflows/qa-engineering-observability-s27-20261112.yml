name: QA S27 Engineering Observability (offline)
on:
  push:
    branches:
      - qa/engineering-observability-s27-20261112

permissions:
  contents: read

jobs:
  offline-observability:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENAI_API_KEY: ''
      OPENAI_SPEC_AGENT_API_KEY: ''
      SUPABASE_SERVER_KEY: ''
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.5'
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Engineering diagnostics unit tests (offline)
        run: pnpm --filter @compra-car/agents exec vitest run test/engineering-worker-telemetry.test.ts test/agent-job-claim-error.test.ts
      - name: Scoped TypeScript check (offline)
        run: pnpm exec tsc --noEmit --strict --target ES2022 --module node16 --moduleResolution node16 scripts/agents/engineering-worker-telemetry.ts scripts/agents/agent-job-claim-error.ts
