name: S27 supervised integration checks
on:
  pull_request:
    paths:
      - 'packages/core/src/agents/**'
      - 'packages/core/test/**'
      - 'packages/adapter-openai/src/**'
      - 'packages/adapter-openai/test/**'
      - 'scripts/agents/**'
      - 'apps/web/src/application/admin/agent-review-projection.ts'
      - '.github/workflows/s27-supervised-integration.yml'
  push:
    branches:
      - integration/s27-supervised-ford-pipeline
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@10.34.5 --activate
      - run: pnpm install --frozen-lockfile
      - name: Core generation tests
        run: pnpm --filter @compra-car/core exec vitest run test/generation-evidence-collector.test.ts test/mmv-generation-evidence.test.ts test/mmv-generation-change-classifier.test.ts test/mmv-generation-integration.test.ts test/spec-agent-supervised-candidates.test.ts test/spec-claim-value-separation.test.ts test/spec-vocabulary-hints.test.ts test/pbev-source-observations.test.ts test/ford-xls-my2027-source-audit.test.ts test/ford-xls-2027-source-fusion.test.ts test/ford-ranger-xls-matrix.test.ts
      - name: OpenAI generation adapter tests
        run: pnpm --filter @compra-car/adapter-openai exec vitest run test/generation-vision-adapter.test.ts test/generation-assessment-provider.test.ts test/spec-pdf-extraction.test.ts
      - name: Adapter typecheck
        run: pnpm --filter @compra-car/adapter-openai typecheck
      - name: Agents typecheck
        run: pnpm --filter @compra-car/agents typecheck
