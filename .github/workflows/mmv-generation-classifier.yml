name: MMV Generation Classifier
on:
  pull_request:
    paths:
      - 'packages/core/src/agents/mmv-generation-change-classifier.ts'
      - 'packages/core/src/agent-platform/review-contract.ts'
      - 'apps/web/src/application/admin/agent-review-*'
      - 'apps/web/src/components/admin/agent-review-inbox.tsx'
      - 'apps/web/src/app/admin/agents/generation-decisions.ts'
      - 'packages/core/src/agents/mmv-generation-review.ts'
      - 'packages/core/src/agents/new-product-check-agent.ts'
      - 'packages/core/src/agents/new-product-check-types.ts'
      - 'packages/core/src/agents/mmv-platform-mapper.ts'
      - 'packages/core/test/mmv-generation-integration.test.ts'
      - 'scripts/agents/run-new-product-check.ts'
      - 'scripts/agents/test/mmv-generation-cli.test.ts'
      - 'packages/core/test/mmv-generation-change-classifier.test.ts'
      - 'packages/core/src/agents/index.ts'
      - '.github/workflows/mmv-generation-classifier.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck core (upstream Price Agent test failures tracked separately)
        continue-on-error: true
        run: pnpm --filter @compra-car/core typecheck
      - name: MMV generation unit tests
        run: pnpm --filter @compra-car/core exec vitest run test/mmv-generation-change-classifier.test.ts test/mmv-generation-integration.test.ts
      - name: Typecheck operational agent scripts
        run: pnpm --filter @compra-car/agents typecheck
      - name: MMV generation CLI regression
        run: pnpm --filter @compra-car/agents exec vitest run test/mmv-generation-cli.test.ts
      - name: Typecheck shared Review UX
        run: pnpm --filter @compra-car/web typecheck
      - name: Shared Reviews generation projection tests
        run: pnpm --filter @compra-car/web exec vitest run src/application/admin/agent-review-projection.test.ts
