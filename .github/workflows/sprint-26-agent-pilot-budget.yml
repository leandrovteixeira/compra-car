name: Sprint 26 — GWM Pilot Cost Admission
on:
  push:
    branches: [sprint-26-agent-ux-control-center]
    paths:
      - 'packages/adapter-openai/src/brand-connector-research-provider.ts'
      - 'packages/adapter-openai/test/brand-connector-research-provider.test.ts'
      - 'scripts/agents/run-brand-connector.ts'
      - 'scripts/agents/ai-usage.ts'
      - 'scripts/agents/test/ai-usage-intended-run.test.ts'
      - 'scripts/agents/agent-diagnostics.ts'
      - 'scripts/agents/agent-pilot-budget.ts'
      - 'scripts/agents/agent-job-worker.ts'
      - 'scripts/agents/enqueue-gwm-brand-qa.ts'
      - 'scripts/agents/test/enqueue-gwm-brand-qa.test.ts'
      - 'scripts/agents/test/agent-pilot-budget.test.ts'
      - 'scripts/agents/agent-openai-credentials.ts'
      - 'scripts/agents/test/agent-openai-credentials.test.ts'
      - '.github/workflows/sprint-26-agent-pilot-budget.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  budget-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENAI_API_KEY: ''
      SUPABASE_SERVER_KEY: ''
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Agent TypeScript
        run: pnpm --filter @compra-car/agents typecheck
      - name: Budget admission, isolated credentials
        run: pnpm --filter @compra-car/agents exec vitest run test/agent-pilot-budget.test.ts test/agent-openai-credentials.test.ts test/agent-environment.test.ts test/enqueue-gwm-brand-qa.test.ts
      - name: Pre-persistence AI usage receipt regression
        run: pnpm --filter @compra-car/agents exec vitest run test/ai-usage-intended-run.test.ts
      - name: Brand Connector incomplete-response usage regression
        run: pnpm --filter @compra-car/adapter-openai exec vitest run test/brand-connector-research-provider.test.ts
      - name: Lint changed agent files
        run: pnpm --filter @compra-car/agents exec eslint agent-pilot-budget.ts agent-job-worker.ts enqueue-gwm-brand-qa.ts run-brand-connector.ts ai-usage.ts agent-diagnostics.ts test/agent-pilot-budget.test.ts test/enqueue-gwm-brand-qa.test.ts
