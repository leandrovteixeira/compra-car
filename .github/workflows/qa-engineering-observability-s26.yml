name: QA Engineering Observability (offline)

on:
  push:
    branches:
      - qa/engineering-observability-s26-20261102

permissions:
  contents: read

jobs:
  offline-observability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.5'
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Engineering diagnostics unit tests (zero AI)
        run: pnpm --filter @compra-car/agents exec vitest run test/engineering-worker-telemetry.test.ts test/agent-job-claim-error.test.ts
      - name: Scoped TypeScript check (zero AI)
        run: pnpm exec tsc --noEmit --strict --target ES2022 --module node16 --moduleResolution node16 scripts/agents/engineering-worker-telemetry.ts scripts/agents/agent-job-claim-error.ts
